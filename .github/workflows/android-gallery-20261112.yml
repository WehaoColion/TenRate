name: Android 全功能交互截图（API 35）

on:
  push:
    branches: [qa/android-full-gallery-20261112]
  workflow_dispatch:

concurrency:
  group: android-gallery-zh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  full-gallery:
    name: Android 2.13.5.1 各模块截图采集与压缩
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact 2.13.5.1-based QA branch
        uses: actions/checkout@v4
      - name: Download already-built signed APK from original source commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ref_run="43171317669"
          required_sha="abbda87fea4fdd8b4725dfc504af340214421a1b"
          actual_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ref_run" --jq .head_sha)"
          test "$actual_sha" = "$required_sha"
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ref_run/jobs?per_page=100" --jq '[.jobs[] | select(.name=="release") | .conclusion] | first')"
          test "$state" = "success"
          mkdir -p signed_apk
          gh run download "$ref_run" --repo "$GITHUB_REPOSITORY" --name tenrate-signed-apk --dir signed_apk
          cd signed_apk
          test -s tenfold_v2.13.5.1.apk
          tr -d '\r' < tenfold_v2.13.5.1.apk.sha256 | sha256sum -c -
      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm
      - name: Compile existing canvas acceptance probe
        shell: bash
        run: rustc --edition=2021 -D warnings -O tools/android_customer_canvas_probe.rs -o android_customer_canvas_probe
      - name: Install PNG visual inspection library and check QA script syntax
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 -m py_compile tools/android_feature_tour.py
          python3 -m py_compile tools/android_gallery_visual_audit.py
      - name: Boot Android Pixel 6 emulator and tour real screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash tools/android-gallery-entrypoint.sh
      - name: Independently audit app pixels and module ownership
        if: always()
        shell: bash
        run: |
          python3 tools/android_gallery_visual_audit.py feature_tour_evidence
      - name: Package Chinese-labeled screenshots and evaluation index
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil, csv, hashlib, collections, re
          from PIL import Image, ImageStat
          evidence=Path("feature_tour_evidence")
          evidence.mkdir(exist_ok=True)
          for filename in ("gallery_tour_log.txt","canvas_probe_log.txt","gallery_status.txt","apk_install_log.txt","app_launch_log.txt","app_clear_log.txt"):
              file=Path(filename)
              if file.exists(): shutil.copy2(file,evidence/filename)
          existing=Path("customer_canvas_evidence")
          if existing.exists():
              target=evidence/"专项验收_客户关系画布"
              if target.exists(): shutil.rmtree(target)
              shutil.copytree(existing,target)
          output=Path("十倍_2.13.5.1_API35_全功能演示_截图及说明.zip")
          with zipfile.ZipFile(output,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for file in sorted(evidence.rglob("*")):
                  if file.is_file(): z.write(file,file.relative_to(evidence.parent))
          # Only count verified, indexed tour screenshots. Diagnostic PNGs are not gallery.
          images=list((evidence/"截图").rglob("*.png"))
          valid=[]
          for image in images:
              data=image.read_bytes()
              if len(data)>=24 and data[:8]==bytes([137,80,78,71,13,10,26,10]):
                  valid.append(image)
          png_count=len(valid)
          # Real PNG signature and byte uniqueness are insufficient: the prior
          # run indexed four full-black emulator frames as valid screenshots.
          # Independently decode and inspect the actual visible App content.
          for image in valid:
              with Image.open(image) as decoded:
                  decoded.verify()
              with Image.open(image) as decoded:
                  frame=decoded.convert("RGB")
                  width,height=frame.size
                  if width<300 or height<500:
                      raise RuntimeError(f"截图尺寸异常：{image}")
                  center=frame.crop((width//8,height//8,7*width//8,7*height//8)).resize((48,64))
                  stats=ImageStat.Stat(center)
                  if max(stats.mean)<8 and max(stats.stddev)<4:
                      raise RuntimeError(f"实际画面全黑/空白（尽管 XML 可能含文字），禁止交付：{image}")
          index=evidence/"操作说明与截图索引.csv"
          if not index.is_file(): raise RuntimeError("缺少中文截图索引")
          with index.open(encoding="utf-8-sig",newline="") as f:
              indexed=list(csv.DictReader(f))
          if len(indexed)!=png_count:
              raise RuntimeError(f"索引 {len(indexed)} 条，与有效截图 {png_count} 张不一致")
          indexed_paths=set()
          module_counts=collections.Counter()
          for item in indexed:
              module=item["功能模块"]
              relative=item["截图相对路径"]
              target=evidence/relative
              if not target.is_file() or target not in valid:
                  raise RuntimeError(f"索引指向不存在或损坏的图片：{relative}")
              if target in indexed_paths or target.parent.name!=module:
                  raise RuntimeError(f"重复索引或模块归属不符：{relative}")
              if not re.search(r"[\u4e00-\u9fff]",item["操作说明"]):
                  raise RuntimeError(f"操作步骤缺少中文说明：{relative}")
              xml=evidence/"界面结构"/module/(target.stem+".xml")
              if not xml.is_file() or "<hierarchy" not in xml.read_text(encoding="utf-8"):
                  raise RuntimeError(f"缺少对应的真实 Android UI 结构证据：{relative}")
              indexed_paths.add(target)
              module_counts[module]+=1
          if len(indexed_paths)!=png_count:
              raise RuntimeError("存在未入索引的截图")
          digest=[hashlib.sha256(image.read_bytes()).hexdigest() for image in valid]
          if len(set(digest))!=png_count:
              raise RuntimeError("截图存在字节级完全重复，不允许重复凑数")
          proof=evidence/"中文模块导航验收.json"
          language=evidence/"中文界面验收.txt"
          if not proof.exists() or not language.exists():
              raise RuntimeError("缺少真实中文模块切换验收证明；拒绝将截图包标为成功")
          checked=__import__("json").loads(proof.read_text(encoding="utf-8"))
          if checked.get("界面语言")!="简体中文" or len(checked.get("模块根页面签名",{}))!=4:
              raise RuntimeError("中文语言或四模块导航验收失败")
          if len(set(checked["模块根页面签名"].values()))!=4:
              raise RuntimeError("模块页面重复，无法证明导航成功")
          for module in ("计时","便签","知识","风控"):
              if not any((evidence/"截图"/module).glob("*.png")):
                  raise RuntimeError(f"模块{module}没有真实截图")
          print("中文界面与四模块独立导航审核：通过")
          if png_count<12:
              print(f"FAIL: only {png_count} actual PNG screenshots; gallery cannot be accepted")
          else:
              print(f"PNG validation successful: {png_count} nonempty PNG files")
          Path("截图统计.txt").write_text(
              f"已索引且字节唯一的真实截图：{png_count} 张\n"+
              "".join(f"{m}：{module_counts[m]} 张\n" for m in ("计时","便签","知识","风控","画布","工作台"))+
              f"目标：700至800张不同功能状态；本次是否达到700：{'是' if png_count>=700 else '否'}\n"+
              f"压缩包：{output.name}\n",encoding="utf-8")
          print(f"Total real screenshots: {png_count}. Archive bytes: {output.stat().st_size}")
          with zipfile.ZipFile(output) as archive:
              bad=archive.testzip()
              if bad: raise RuntimeError(f"Corrupted screenshot ZIP member: {bad}")
              if png_count<700:
                  raise RuntimeError(f"仅 {png_count} 张不同截图，尚未达到700张全面覆盖目标；保留ZIP作为阶段诊断，不得宣称全功能交付")
              if any(module_counts[m]<50 for m in ("计时","便签","知识","风控")):
                  raise RuntimeError(f"四模块覆盖不均衡：{dict(module_counts)}；不得宣称全面覆盖")
          PY
          cat 截图统计.txt >> "$GITHUB_STEP_SUMMARY"
          if test -f feature_tour_evidence/请先阅读.txt; then
            cat feature_tour_evidence/请先阅读.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload self-contained ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenrate-2.13.5.1-full-feature-screenshot-zip
          path: |
            十倍_2.13.5.1_API35_全功能演示_截图及说明.zip
            截图统计.txt
          retention-days: 30
          if-no-files-found: warn
