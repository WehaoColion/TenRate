name: Android emulator interaction audit

on:
  push:
    branches: [test/android-emulator-audit-20261103]
    paths:
      - ".github/workflows/android-emulator-audit.yml"
      - "tools/android_emulator_probe.rs"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  emulator-audit:
    name: Android API ${{ matrix.api-level }} UI audit
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
    steps:
      - name: Checkout emulator probe
        uses: actions/checkout@v4

      - name: Prepare Rust compiler
        uses: dtolnay/rust-toolchain@stable

      - name: Build adb probe in Rust
        run: |
          rustc --edition=2021 -D warnings -O tools/android_emulator_probe.rs -o android_emulator_probe

      - name: Download latest signed Android candidate APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p emulator_apk
          gh run download 41587894266 --repo "$GITHUB_REPOSITORY" --name tenrate-signed-apk --dir emulator_apk
          find emulator_apk -maxdepth 2 -type f -printf '%p %s bytes\n'
          test "$(find emulator_apk -type f -name '*.apk' | wc -l)" -eq 1

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm

      - name: Install signed APK and exercise real UI on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            set -eu
            adb devices
            APK="$(find emulator_apk -type f -name '*.apk' | head -n 1)"
            adb install -r "$APK"
            mkdir -p "emulator_evidence/api_${{ matrix.api-level }}"
            ./android_emulator_probe "emulator_evidence/api_${{ matrix.api-level }}"

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          if test -f "emulator_evidence/api_${{ matrix.api-level }}/report.md"; then
            cat "emulator_evidence/api_${{ matrix.api-level }}/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Android emulator audit did not produce a report. Review the failed job step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots, accessibility trees, logcat and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence-api-${{ matrix.api-level }}
          path: emulator_evidence/
          if-no-files-found: warn
          retention-days: 21
