      - name: Install and launch Android app, type a long note, confirm compact home
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            set -eu
            adb install -r sticky_apk/tenfold_v3.0.2.3.apk
            ./sticky_home_probe sticky_summary_evidence
      - name: Summarize actual emulator result
        if: always()
        shell: bash
        run: |
          if test -f sticky_summary_evidence/report.md; then
            cat sticky_summary_evidence/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Device execution did not finish; UI acceptance unverified.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload screenshots, UI hierarchies and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sticky-summary-v3.0.2.3-api35-evidence
          path: sticky_summary_evidence/
          if-no-files-found: warn
          retention-days: 21
