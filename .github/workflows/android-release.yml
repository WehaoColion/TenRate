# v3.0.2.39 - Compact AI conversation layout, independent history and real emulator gate.
# v3.0.2.35 - Execute baseline and million-row workloads on both emulator APIs.
# v3.0.2.33 - One candidate publisher and mandatory branch-independent emulator acceptance.
# v3.0.2.27 - Run unchanged acceptance on API 35 and 36.
name: Android signed APK

on:
  push:
    paths:
      - 'app/**'
      - 'native/gridtimer_native/**'
      - 'tools/android*'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle*'
      - 'settings.gradle*'
      - '.github/workflows/android-release.yml'
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    name: Android repository contract and historical error replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute the Rust contract before signing
        run: |
          rustup toolchain install stable --profile minimal
          rustc +stable --edition=2021 -D warnings --test tools/android_repository_contract.rs -o android_repository_contract_tests
          ./android_repository_contract_tests --nocapture
          rustc +stable --edition=2021 -D warnings tools/android_repository_contract.rs -o android_repository_contract
          ./android_repository_contract

  release:
    needs: repository-contract
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      # Public metadata recovered from the user-supplied, formally signed v2.23 APK.
      # Never generate a replacement desktop service identity on a CI runner.
      GRID_TIMER_ANDROID_RENDEZVOUS_PUBLIC_KEY: B_bNXMMqkLjbwJeFouOFQyODcdzRtjL-ApRdtVEFx14
      GRID_TIMER_PUBLIC_SERVER_URL_FILE: C:\gt\sync_public_server_url.txt
      CARGO_TARGET_DIR: C:\gt\gridtimer-build\sourcegen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk.exe
            C:\gt\gridtimer-build
          key: ${{ runner.os }}-android-v1-${{ hashFiles('native/gridtimer_native/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-android-v1-${{ hashFiles('native/gridtimer_native/Cargo.lock') }}-
      - name: Prepare Rust and Android tools
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force C:\gt | Out-Null
          [IO.File]::WriteAllText($env:GRID_TIMER_PUBLIC_SERVER_URL_FILE, 'https://lasting-multi-indirect-belong.trycloudflare.com')
          "GRID_TIMER_NATIVE_LIB_PATH=$env:LIB" >> $env:GITHUB_ENV
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.1.12297006'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
          "GRID_TIMER_NDK_DIR=$env:ANDROID_HOME\ndk\27.1.12297006" >> $env:GITHUB_ENV
          rustup toolchain install stable --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          if ($LASTEXITCODE -ne 0) { throw 'Android Rust targets unavailable' }
          if (!(Test-Path "$env:USERPROFILE\.cargo\bin\cargo-ndk.exe")) {
            cargo install cargo-ndk --locked
            if ($LASTEXITCODE -ne 0) { throw 'cargo-ndk installation failed' }
          }
          cargo fetch --locked --manifest-path native/gridtimer_native/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Cargo dependency fetch failed' }
          rustc --version
          java -version
      - name: Verify generator and product identity
        run: |
          cargo test --locked --offline --manifest-path native/gridtimer_native/Cargo.toml --bin gridtimer_sourcegen
          if ($LASTEXITCODE -ne 0) { throw 'Source generator tests failed' }
          cargo test --locked --offline --manifest-path native/gridtimer_native/Cargo.toml --lib product_identity::tests
          if ($LASTEXITCODE -ne 0) { throw 'Product identity tests failed' }
          cargo test --locked --offline --manifest-path native/gridtimer_native/Cargo.toml --lib note_documents::tests
          if ($LASTEXITCODE -ne 0) { throw 'Document storage compatibility failed' }
          cargo test --locked --offline --manifest-path native/gridtimer_native/Cargo.toml --lib android_canvas::tests
          if ($LASTEXITCODE -ne 0) { throw 'Rust customer canvas and graph tests failed' }
          cargo test --locked --offline --manifest-path native/gridtimer_native/Cargo.toml --lib android_ai_conversation::tests
          if ($LASTEXITCODE -ne 0) { throw 'Conversation request tests failed' }
          cargo test --locked --offline --manifest-path native/gridtimer_native/Cargo.toml --lib android_ai_images::tests
          if ($LASTEXITCODE -ne 0) { throw 'Multimodal image validation tests failed' }
          cargo test --locked --offline --manifest-path native/gridtimer_native/Cargo.toml --lib ai_client::tests::android_images
          if ($LASTEXITCODE -ne 0) { throw 'Multimodal conversation tests failed' }
          cargo test --locked --offline --manifest-path native/gridtimer_native/Cargo.toml --lib ai_client::tests::deepseek_pro_connection_tests_text_without_sending_images
          if ($LASTEXITCODE -ne 0) { throw 'DeepSeek Pro capability regression failed' }
          cargo test --locked --offline --manifest-path native/gridtimer_native/Cargo.toml --lib android_snapshot_codec::tests
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot codec regression tests failed' }
          cargo test --locked --offline --manifest-path native/gridtimer_native/Cargo.toml --lib android_snapshot_verifier::tests
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot verifier regression tests failed' }
          cargo test --locked --offline --manifest-path native/gridtimer_native/Cargo.toml --lib knowledge_filter::tests
          if ($LASTEXITCODE -ne 0) { throw 'Knowledge filter Rust regression tests failed' }
          cargo test --locked --offline --manifest-path native/gridtimer_native/Cargo.toml --lib knowledge_hierarchy_persistence_tests
          if ($LASTEXITCODE -ne 0) { throw 'Knowledge hierarchy mutation regression tests failed' }
      - name: Compile the Android simulator probe early
        run: |
          rustc --edition=2021 -D warnings --emit=metadata tools/android_canvas_flicker_probe.rs -o "$env:RUNNER_TEMP\canvas_probe.rmeta"
          if ($LASTEXITCODE -ne 0) { throw 'Canvas emulator probe does not compile' }
          $probes = @(
            'tools/android_knowledge_motion_probe.rs',
            'tools/android_ai_conversation_probe.rs',
            'tools/android_locale_probe.rs',
            'tools/android_knowledge_save_probe.rs',
            'tools/android_document_typing_probe.rs'
          )
          foreach ($probe in $probes) {
            $probeName = [IO.Path]::GetFileNameWithoutExtension($probe)
            $output = Join-Path $env:RUNNER_TEMP "$probeName.rmeta"
            & rustc --edition=2021 -D warnings --emit=metadata $probe -o $output
            if ($LASTEXITCODE -ne 0) { throw "Android acceptance probe does not compile cleanly: $probe" }
          }
      - name: Restore signing inputs and verify original certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'ANDROID_KEYSTORE_BASE64','ANDROID_STORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD') {
            if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing secret: $name" }
          }
          $store = Join-Path $env:RUNNER_TEMP 'tenrate-release.jks'
          [IO.File]::WriteAllBytes($store, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          $cert = Join-Path $env:RUNNER_TEMP 'tenrate-release.der'
          & "$env:JAVA_HOME\bin\keytool.exe" -exportcert -keystore $store -alias $env:ANDROID_KEY_ALIAS -storepass:env ANDROID_STORE_PASSWORD -file $cert
          if ($LASTEXITCODE -ne 0) { throw 'Cannot export signing certificate' }
          if ((Get-FileHash $cert -Algorithm SHA256).Hash.ToLowerInvariant() -cne '4ac7b86a600bbb3215a6187018c1442efcf3ffb25cdbeea0082cab81ef4d605f') {
            throw 'Signing certificate differs from the original APK. Refusing to package.'
          }
          function Escape-Property([string]$value) {
            return -join ($value.ToCharArray() | ForEach-Object { '\u{0:x4}' -f [int]$_ })
          }
          $lines = @(
            'storeFile=' + (Escape-Property $store)
            'storePassword=' + (Escape-Property $env:ANDROID_STORE_PASSWORD)
            'keyAlias=' + (Escape-Property $env:ANDROID_KEY_ALIAS)
            'keyPassword=' + (Escape-Property $env:ANDROID_KEY_PASSWORD)
          )
          [IO.File]::WriteAllLines((Join-Path $env:GITHUB_WORKSPACE 'release_signing.properties'), $lines, [Text.Encoding]::ASCII)
      - name: Build and check release APK
        run: |
          gradle --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
          if ($LASTEXITCODE -ne 0) { throw 'Release build or checks failed' }
          $version = [regex]::Match((Get-Content app/build.gradle -Raw), "versionName '([^']+)'").Groups[1].Value
          $apk = "app/build/outputs/apk/release/tenfold_v$version.apk"
          $verification = & "$env:ANDROID_HOME\build-tools\35.0.0\apksigner.bat" verify --verbose --print-certs $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
          $verification | Write-Output
          if (($verification -join "`n") -notmatch 'Signer #1 certificate SHA-256 digest: 4ac7b86a600bbb3215a6187018c1442efcf3ffb25cdbeea0082cab81ef4d605f') {
            throw 'Packaged APK certificate differs from the original APK'
          }
          $source = Get-Content app/build/generated/source/rustAndroid/main/com/ofairyo/gridtimer/data/SyncRemoteRendezvous.kt -Raw
          if (!$source.Contains($env:GRID_TIMER_ANDROID_RENDEZVOUS_PUBLIC_KEY) -or !$source.Contains('2b91568570d864be134fb6392e68d135cde0ea3a60f85166bc1e9d015adfaa49')) {
            throw 'Generated sync discovery configuration changed'
          }
          $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  tenfold_v$version.apk" | Set-Content "$apk.sha256" -Encoding ascii
          Copy-Item $apk "tenfold_v$version.apk"
          New-Item -ItemType Directory -Force APK | Out-Null
          Copy-Item $apk "APK/tenfold_v$version.apk"
          "Built Android $version from $env:GITHUB_SHA; SHA256 $hash" >> $env:GITHUB_STEP_SUMMARY
          'Device installation, UI appearance and live account synchronization have not been verified by this workflow.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tenrate-signed-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save Rust build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk.exe
            C:\gt\gridtimer-build
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Remove signing inputs
        if: always()
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue release_signing.properties
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'tenrate-release.jks')
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'tenrate-release.der')

  knowledge-save-emulator:
    name: Android ${{ matrix.api }} ${{ matrix.history }} signed APK knowledge save and editor acceptance
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
        history: [baseline, extreme]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact signed APK from this commit
        uses: actions/download-artifact@v4
        with:
          name: tenrate-signed-apk
          path: signed_apk
      - name: Check APK SHA256 and compile the Rust UI probe
        shell: bash
        run: |
          set -euo pipefail
          cd signed_apk
          shopt -s nullglob
          packages=(tenfold_v*.apk)
          test "${#packages[@]}" -eq 1
          tr -d '\r' < "${packages[0]}.sha256" | sha256sum -c -
          cd ..
          case "${{ matrix.history }}" in
            baseline) stress_flags=() ;;
            extreme) stress_flags=(--cfg tenrate_extreme_history) ;;
            *) echo "Unknown stress profile"; exit 1 ;;
          esac
          rustc --edition=2021 -D warnings -O "${stress_flags[@]}" tools/android_knowledge_save_probe.rs -o knowledge_save_probe
          rustc --edition=2021 -D warnings -O tools/android_document_typing_probe.rs -o document_typing_probe
      - name: Reserve host storage for the selected real history workload
        shell: bash
        run: |
          set -euo pipefail
          # Remove unused preinstalled SDKs, not Android tools or the signed APK.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h .
          available_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          minimum_gib=40
          if [ "${{ matrix.history }}" = extreme ]; then minimum_gib=72; fi
          if [ "$available_kib" -lt "$((minimum_gib * 1024 * 1024))" ]; then
            echo "Insufficient host disk for selected workload: ${{ matrix.history }}. Need ${minimum_gib} GiB before emulator setup. Refusing to shrink fixture."
            exit 1
          fi
      - name: Prepare SQLite for the Rust history-load fixture
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3
      - name: Enable hardware-assisted Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm
      - name: Install, launch, create a page, force-stop and verify on device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: ${{ matrix.history == 'extreme' && '64G' || '32G' }}
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            set -eu
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "${{ matrix.api }}"
            adb install -r signed_apk/tenfold_v*.apk
            ./document_typing_probe document_typing_evidence || touch document_typing_failed
            adb shell pm clear com.ofairyo.gridtimer
            adb shell cmd locale set-app-locales com.ofairyo.gridtimer --locales zh-CN || true
            ./knowledge_save_probe sticky_newline_evidence --sticky-newlines || touch sticky_newlines_failed
            adb shell pm clear com.ofairyo.gridtimer
            adb shell cmd locale set-app-locales com.ofairyo.gridtimer --locales zh-CN || true
            ./knowledge_save_probe knowledge_save_evidence || touch knowledge_save_failed
            grep -Fx 'profile=${{ matrix.history }}' knowledge_save_evidence/stress_profile.txt
            test ! -f document_typing_failed
            test ! -f sticky_newlines_failed
            test ! -f knowledge_save_failed
      - name: Summarize actual simulator acceptance
        if: always()
        shell: bash
        run: |
          if test -f document_typing_evidence/report.md; then cat document_typing_evidence/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if test -f sticky_newline_evidence/report.md; then cat sticky_newline_evidence/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if test -f knowledge_save_evidence/report.md; then
            cat knowledge_save_evidence/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Emulator acceptance did not complete; inspect logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload screenshots, accessibility tree and save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-knowledge-save-and-typing-api${{ matrix.api }}-${{ matrix.history }}-${{ github.sha }}
          path: |
            document_typing_evidence/
            sticky_newline_evidence/
            knowledge_save_evidence/
            !knowledge_save_evidence/*.db*
            !knowledge_save_evidence/legacy_history_payload_sample.json
          if-no-files-found: warn
          retention-days: 21

  publish-signed-test-candidate:
    name: Publish signed Android test APK (acceptance independently tracked)
    if: github.ref != 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tenrate-signed-apk
          path: package
      - name: Publish immutable commit-scoped test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings -O tools/android_candidate_publish.rs -o android_candidate_publish
          ./android_candidate_publish

  knowledge-design-emulator:
    name: Android 2.13.5.8 knowledge workspace on API 35
    if: github.ref == 'refs/heads/feat/android-knowledge-workspace-design-v2.13.5.8'
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve matching signed APK
        uses: actions/download-artifact@v4
        with:
          name: tenrate-signed-apk
          path: knowledge_apk
      - name: Verify APK and compile Rust emulator driver
        shell: bash
        run: |
          set -euo pipefail
          cd knowledge_apk
          tr -d '\r' < tenfold_v2.13.5.8.apk.sha256 | sha256sum -c -
          cd ..
          rustc --edition=2021 -D warnings -O tools/android_knowledge_design_probe.rs -o knowledge_design_probe
      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm
      - name: Install signed APK, launch and exercise knowledge directory
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            set -eu
            adb install -r knowledge_apk/tenfold_v2.13.5.8.apk
            adb shell cmd locale set-app-locales com.ofairyo.gridtimer --locales zh-CN || true
            ./knowledge_design_probe knowledge_design_evidence
      - name: Report real emulator evidence
        if: always()
        shell: bash
        run: |
          if test -f knowledge_design_evidence/report.md; then
            cat knowledge_design_evidence/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No emulator acceptance report; device UI acceptance is unverified." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload screenshots and accessibility trees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-knowledge-design-v2.13.5.8-evidence
          path: knowledge_design_evidence/
          if-no-files-found: warn
          retention-days: 21

  canvas-emulator:
    name: Canvas gesture emulator API 35
    if: github.ref == 'refs/heads/fix/android-canvas-gesture-flicker-v2.23.4.11'
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout candidate sources
        uses: actions/checkout@v4
      - name: Fetch signed APK from this exact commit
        uses: actions/download-artifact@v4
        with:
          name: tenrate-signed-apk
          path: emulator_apk
      - name: Build the simulator probe in Rust
        run: rustc --edition=2021 -D warnings -O tools/android_canvas_flicker_probe.rs -o android_canvas_flicker_probe
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm
      - name: Install signed APK and test canvas gestures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            set -eu
            adb install -r "$(find emulator_apk -name '*.apk' -print -quit)"
            ./android_canvas_flicker_probe canvas_emulator_evidence
      - name: Publish test summary
        if: always()
        run: |
          if test -f canvas_emulator_evidence/report.md; then
            cat canvas_emulator_evidence/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Canvas simulator did not produce a report; inspect job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload simulator recording and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-canvas-flicker-emulator-evidence
          path: canvas_emulator_evidence/
          if-no-files-found: warn
          retention-days: 21


  legal-knowledge-emulator:
    name: Launch signed APK and verify persisted knowledge exclusion on emulator
    if: github.ref == 'refs/heads/feat/android-legal-knowledge-exclusions-20261108'
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: Checkout Rust simulator probe
        uses: actions/checkout@v4

      - name: Download signed candidate from this exact build
        uses: actions/download-artifact@v4
        with:
          name: tenrate-signed-apk
          path: signed_apk

      - name: Verify package identity and compile Rust acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd signed_apk
          tr -d '\r' < tenfold_v2.23.4.13.apk.sha256 | sha256sum -c -
          cd ..
          rustc --edition=2021 -D warnings -O tools/android_legal_exclusion_probe.rs -o legal_exclusion_probe

      - name: Enable KVM acceleration for actual Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm

      - name: Launch app, exclude root, restart process, verify and restore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
