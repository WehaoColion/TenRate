name: Android legal knowledge exclusion emulator quick acceptance

on:
  push:
    branches: [feat/android-legal-knowledge-exclusions-20261108]
    paths:
      - "tools/android_legal_exclusion_probe.rs"
      - ".github/workflows/android-legal-exclusion-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify v2.23.4.13 signed APK through real Android UI
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: Checkout the latest Rust acceptance probe
        uses: actions/checkout@v4

      - name: Fetch previously signed identical Android app build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signed_apk
          gh run download 42403802207 --repo "$GITHUB_REPOSITORY" --name tenrate-signed-apk --dir signed_apk
          cd signed_apk
          tr -d '\r' < tenfold_v2.23.4.13.apk.sha256 | sha256sum -c -

      - name: Compile the Rust UI acceptance probe
        run: rustc --edition=2021 -D warnings -O tools/android_legal_exclusion_probe.rs -o legal_exclusion_probe

      - name: Enable accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm

      - name: Launch signed app, exclude, restart and restore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            set -eu
            adb install -r signed_apk/tenfold_v2.23.4.13.apk
            ./legal_exclusion_probe legal_exclusion_evidence

      - name: Show emulator acceptance result
        if: always()
        run: |
          if test -f legal_exclusion_evidence/report.md; then
            cat legal_exclusion_evidence/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No emulator report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and accessibility hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-legal-knowledge-exclusion-fast-emulator
          path: legal_exclusion_evidence/
          if-no-files-found: warn
          retention-days: 21
