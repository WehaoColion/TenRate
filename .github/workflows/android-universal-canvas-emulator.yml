name: Universal canvas Android emulator acceptance

on:
  push:
    branches: [feat/android-universal-canvas-entry-20261111]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: universal-canvas-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: API 35 ordinary canvas and customer template end-to-end
    runs-on: ubuntu-22.04
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - name: Compile Rust UI acceptance driver
        shell: bash
        run: rustc --edition=2021 -D warnings -O tools/android_universal_canvas_probe.rs -o android_universal_canvas_probe
      - name: Download checked signed APK from matching commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 170); do
            response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-release.yml/runs?branch=feat/android-universal-canvas-entry-20261111&per_page=50")"
            match="$(printf '%s' "$response" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | first | if . == null then "" else "\(.id) \(.status) \(.conclusion // "")" end')"
            if test -n "$match"; then
              read -r run_id status conclusion <<< "$match"
              if test "$status" = completed; then
                if test "$conclusion" != success; then
                  echo "Signed APK build $run_id ended with $conclusion" >&2
                  exit 1
                fi
                echo "$run_id" > signed_build_run_id.txt
                break
              fi
            fi
            sleep 30
          done
          test -s signed_build_run_id.txt
          gh run download "$(cat signed_build_run_id.txt)" --repo "$GITHUB_REPOSITORY" --name tenrate-signed-apk --dir signed_apk
          cd signed_apk
          test -f tenfold_v2.23.4.16.apk
          tr -d '\r' < tenfold_v2.23.4.16.apk.sha256 | sha256sum -c -
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          test -e /dev/kvm
      - name: Install, launch, edit, connect, switch and restart Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            set -eu
            adb install -r signed_apk/tenfold_v2.23.4.16.apk
            ./android_universal_canvas_probe universal_canvas_evidence
      - name: Publish checked report
        if: always()
        run: |
          if test -f universal_canvas_evidence/report.md; then
            cat universal_canvas_evidence/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Emulator was unable to complete the acceptance driver." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload screenshots and full accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-canvas-v2.23.4.16-evidence
          path: |
            universal_canvas_evidence/
            signed_build_run_id.txt
          if-no-files-found: warn
          retention-days: 21
