[package]
name = "tenrate_ios_core"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"

[lib]
crate-type = ["staticlib", "rlib"]
test = false
doctest = false

[dependencies]
indexmap = { version = "2.13.1", features = ["serde"] }
rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_ignored = "0.1.14"
sha2 = "0.10.8"
url = "2.5.8"

[profile.release]
opt-level = "s"
lto = true
